name: ESG Dependency Lock Repair

on:
  push:
    branches: [esg-p0-shadow]

permissions:
  contents: write

jobs:
  repair-lock:
    if: ${{ !contains(github.event.head_commit.message, '[skip-lock-repair]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: esg-p0-shadow
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install exact baseline dependencies
        run: npm ci
      - name: Repair production dependency lock within declared semver ranges
        run: npm audit fix --package-lock-only
      - name: Verify production dependency gate
        run: npm audit --omit=dev --audit-level=high
      - name: Commit repaired lockfile if changed
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- package-lock.json; then
            echo "package-lock.json already clean"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "chore(security): repair production dependency lock [skip-lock-repair]"
          git push origin HEAD:esg-p0-shadow
