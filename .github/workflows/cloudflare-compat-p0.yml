name: Cloudflare Compatibility P0

on:
  push:
    branches: [cloudflare-compat-p0]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  workerd-compat:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: experiments/cloudflare-compat
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install probe dependencies
        run: npm install --no-package-lock
      - name: Bundle for Workers without deploying
        run: npm run dry-run
      - name: Start local workerd
        run: |
          npm run dev > /tmp/wrangler.log 2>&1 &
          echo $! > /tmp/wrangler.pid
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8787/health >/tmp/health.json; then
              cat /tmp/health.json
              exit 0
            fi
            sleep 1
          done
          cat /tmp/wrangler.log
          exit 1
      - name: Runtime smoke - pdfjs-dist
        run: |
          curl -fsS http://127.0.0.1:8787/probe/pdf | tee /tmp/pdf.json
          node -e "const x=require('/tmp/pdf.json'); if(!x.ok) process.exit(1);"
      - name: Generate 165-page synthetic PDF
        run: node scripts/make-fixture.mjs
      - name: Runtime smoke - 165-page PDF
        run: |
          curl -fsS -X POST --data-binary @/tmp/kssb-synthetic-165.pdf http://127.0.0.1:8787/probe/pdf-post | tee /tmp/pdf165.json
          node -e "const x=require('/tmp/pdf165.json'); if(!x.ok || x.pages!==165 || x.beforeBytes<=0 || x.afterBytes!==x.beforeBytes) process.exit(1);"
      - name: Runtime smoke - ESG core logic
        run: |
          curl -fsS http://127.0.0.1:8787/probe/esg | tee /tmp/esg.json
          node -e "const x=require('/tmp/esg.json'); if(!x.ok) process.exit(1);"
      - name: Runtime smoke - local R2 binding
        run: |
          curl -fsS http://127.0.0.1:8787/probe/r2 | tee /tmp/r2.json
          node -e "const x=require('/tmp/r2.json'); if(!x.ok) process.exit(1);"
      - name: Runtime smoke - Neon driver bundle
        run: |
          curl -fsS http://127.0.0.1:8787/probe/neon-driver | tee /tmp/neon.json
          node -e "const x=require('/tmp/neon.json'); if(!x.ok) process.exit(1);"
      - name: Runtime smoke - local Workflow lifecycle via official CLI
        run: |
          npx wrangler workflows trigger llmwiki-compat-workflow '{"sourceId":"KSSB-S2-2026"}' --id compat-ci --local --port 8787 --json | tee /tmp/workflow-trigger.json
          for i in $(seq 1 20); do
            npx wrangler workflows instances describe llmwiki-compat-workflow compat-ci --local --port 8787 --json | tee /tmp/workflow-status.json
            STATUS=$(node -e "const x=require('/tmp/workflow-status.json'); console.log(x.status ?? x.instance?.status ?? '')")
            if [ "$STATUS" = "complete" ]; then exit 0; fi
            if [ "$STATUS" = "errored" ] || [ "$STATUS" = "terminated" ]; then exit 1; fi
            sleep 1
          done
          exit 1
      - name: Runtime smoke - mammoth bundle
        run: |
          curl -fsS http://127.0.0.1:8787/probe/mammoth | tee /tmp/mammoth.json
          node -e "const x=require('/tmp/mammoth.json'); if(!x.ok) process.exit(1);"
      - name: Stop local workerd
        if: always()
        run: |
          kill $(cat /tmp/wrangler.pid) 2>/dev/null || true
          tail -100 /tmp/wrangler.log || true
